name: muenee
description: MueNee helps users discover nearby meals.
publish_to: none
version: 1.0.1+5000

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_app_check: ^0.4.7
  firebase_auth: ^6.6.1
  firebase_ai: ^4.0.0
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  image_picker: ^1.2.3
  firebase_analytics: 12.5.0
  firebase_crashlytics: 5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/prompt/Prompt-Regular.ttf
          weight: 400
        - asset: assets/fonts/prompt/Prompt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/prompt/Prompt-Bold.ttf
          weight: 700
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/noto_sans_thai/NotoSansThai-wdth-wght.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_thai/NotoSansThai-wdth-wght.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_thai/NotoSansThai-wdth-wght.ttf
          weight: 600
        - asset: assets/fonts/noto_sans_thai/NotoSansThai-wdth-wght.ttf
          weight: 700
